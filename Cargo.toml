[package]
name = "verandah-plugin-pomodoro"
version = "0.15.1"
edition = "2024"
description = "Pomodoro timer widget plugin for verandah"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "verandah-pomodoroctl"
path = "src/bin/pomodoroctl.rs"

[dependencies]
verandah-plugin = { git = "https://github.com/sw1nn/verandah-plugin.git", tag = "v2.1.0" }
abi_stable = "0.11"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
derive_more = { version = "2.1", features = ["from", "display", "debug"] }
strum = { version = "0.28", features = ["derive"] }
xdg = "3.0"
clap = { version = "4.6", features = ["derive"] }

# Audio
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "mp3",
  "wav",
  "vorbis",
] }

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
